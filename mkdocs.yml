site_name: Preclinical MRI dataset toolkit
site_description: Bruker Paravision dataset loader and NIfTI converter
site_url: https://brkraw.github.io/
repo_url: https://github.com/BrkRaw/brkraw
repo_name: BrkRaw/brkraw
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: assets/brkraw-logo.svg
  font:
    text: Space Grotesk
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
  features:
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - search.highlight
    - search.share

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - CLI:
      - Overview: cli/info-and-params.md
      - Session helpers: cli/session.md
      - Convert command: cli/convert.md
      - Addons: cli/addon.md
      - Config: cli/config.md
      - Prune: cli/prune.md
  - API:
      - Overview: python-api.md
      - CLI Equivalents: api/cli-workflows.md
      - Layout API: api/layout.md
      - Addon API: api/addon.md
      - Pruner API: api/pruner.md
  - Contribution:
      - Extending BrkRaw: contribution.md
      - Rules: rule-syntax.md
      - Specs: spec-syntax.md
      - Addons and Plugins: addons-and-plugins.md
      - Contributors: contributors.md
  - Reference:
      - Configuration: configuration.md
