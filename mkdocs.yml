site_name: Preclinical MRI dataset toolkit
site_description: Bruker Paravision dataset loader and NIfTI converter
site_url: https://brkraw.github.io/
repo_url: https://github.com/BrkRaw/brkraw
repo_name: BrkRaw/brkraw
edit_uri: edit/main/docs/
use_directory_urls: false

theme:
  name: material
  language: en
  custom_dir: docs/overrides
  favicon: assets/favicon.ico
  logo: assets/brkraw-logo.svg
  font:
    false
  palette:
    - scheme: default
      primary: custom
      accent: custom
  features:
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - navigation.instant
    - navigation.instant.prefetch
    - search.highlight
    - search.share

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - CLI:
      - Overview: cli/info-and-params.md
      - Session helpers: cli/session.md
      - Convert command: cli/convert.md
      - Addons: cli/addon.md
      - Config: cli/config.md
      - Prune: cli/prune.md
  - API:
      - Overview: api/overview.md
      - CLI Equivalents: api/cli-workflows.md
      - Layout API: api/layout.md
      - Addon API: api/addon.md
      - Pruner API: api/pruner.md
  - Contribution:
      - Extending BrkRaw: contrib/contribution.md
      - Rule Syntax: contrib/rule-syntax.md
      - Spec Syntax: contrib/spec-syntax.md
      - Addons and Plugins: contrib/addons-and-plugins.md
      - Core vs Addon Development: contrib/development-model.md
      - Contributors: contrib/contributors.md
  - Reference:
      - Configuration: configuration.md
