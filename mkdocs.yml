site_name: Preclinical MRI dataset toolkit
site_description: Bruker Paravision dataset loader and NIfTI converter
site_url: https://brkraw.github.io/
repo_url: https://github.com/BrkRaw/brkraw
repo_name: BrkRaw/brkraw
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: assets/brkraw-logo.svg
  font:
    text: Space Grotesk
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
  features:
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - search.highlight
    - search.share

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started: Getting-Started.md
  - CLI:
      - Overview: cli/CLI-info_and_params.md
      - Session helpers: cli/CLI-set_unset_and_env.md
      - Convert command: cli/CLI-convert.md
      - Addons: cli/CLI-addon.md
      - Config: cli/CLI-config.md
      - Prune: cli/CLI-prune.md
  - API:
      - Overview: Python-API.md
      - CLI Equivalents: api/API-Workflows.md
      - Layout API: api/API-Layout.md
      - Addon API: api/API-Addon.md
      - Pruner API: api/API-Pruner.md
  - Contribution:
      - Extending BrkRaw: Contribution.md
      - Rules: RULE-Syntax.md
      - Specs: SPEC-Syntax.md
      - Addons and Plugins: Addons-and-Plugins.md
      - Contributors: Contributors.md
  - Reference:
      - Configuration: Config.md
